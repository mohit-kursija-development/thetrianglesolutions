<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Past Orders - The Triangle Solutions</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/past_orders.css') }}">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header-section">
            <div class="row align-items-center">
                <div class="col-md-6">
                    <h2><i class="bi bi-clock-history"></i> Past Orders</h2>
                </div>
                <div class="col-md-6 text-md-end">
                    <p style="margin: 0; margin-bottom: 10px;">Welcome, <strong>{{ username }}</strong></p>
                    <div style="display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap;">
                        <a href="{{ url_for('orders') }}" class="new-order-btn"><i class="bi bi-plus-circle"></i> New Order</a>
                        <a href="{{ url_for('shops') }}" class="new-order-btn"><i class="bi bi-shop"></i> Shops</a>
                        {% if role == 'admin' %}
                        <a href="{{ url_for('sales') }}" class="new-order-btn"><i class="bi bi-graph-up"></i> Sales</a>
                        {% endif %}
                        <a href="{{ url_for('logout') }}" class="logout-btn"><i class="bi bi-box-arrow-right"></i> Logout</a>
                    </div>
                </div>
            </div>
        </div>

        <!-- Search Section -->
        <div class="search-section">
            <div class="search-label"><i class="bi bi-search"></i> Search Orders</div>
            <div class="search-wrapper">
                <input 
                    type="text" 
                    id="searchInput" 
                    class="search-input" 
                    placeholder="Search by shop name..."
                    onkeyup="searchOrders()">
            </div>
        </div>

        <!-- Save Orders -->
        <!-- Display only to admin -->
        {% if role == "admin" %}
            <div class="save-orders-section">
                <a class="section-title" href="/save_orders"><i class="bi bi-calendar-day"></i> Save Orders</a>
            </div>
        {% endif %}

        <!-- Orders Display -->
        <div class="orders-container">
            <div id="ordersContent">
                <div class="loading-message"><i class="bi bi-hourglass-split"></i> Loading past orders...</div>
            </div>
        </div>
    </div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Store user role for access control
        const userRole = "{{ role }}";
    </script>
    <script src="{{ url_for('static', filename='js/past_orders.js') }}"></script>
</body>
</html>
