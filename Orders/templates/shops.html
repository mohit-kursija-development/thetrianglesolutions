<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop Payments - The Triangle Solutions</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/shops.css') }}">
</head>
<body>
    <div class="container-fluid">
        <!-- Header -->
        <div class="header-section">
            <div class="row align-items-center">
                <div class="col-md-6">
                    <h2><i class="bi bi-shop"></i> Shop Payments</h2>
                </div>
                <div class="col-md-6 text-md-end">
                    <p style="margin: 0; margin-bottom: 10px;">Welcome, <strong>{{ username }}</strong></p>
                    <div style="display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap;">
                        <a href="{{ url_for('orders') }}" class="nav-btn"><i class="bi bi-graph-up"></i> Orders</a>
                        <a href="{{ url_for('past_orders') }}" class="nav-btn"><i class="bi bi-clock-history"></i> Past Orders</a>
                        {% if role == 'admin' %}
                        <a href="{{ url_for('sales') }}" class="nav-btn"><i class="bi bi-bar-chart-line"></i> Sales</a>
                        <a href="{{ url_for('save_orders') }}" class="nav-btn"><i class="bi bi-download"></i> Download</a>
                        {% endif %}
                        <a href="{{ url_for('logout') }}" class="logout-btn"><i class="bi bi-box-arrow-right"></i> Logout</a>
                    </div>
                </div>
            </div>
        </div>

        <!-- Store role for JavaScript -->
        <script>
            const userRole = "{{ role }}";
        </script>

        <div class="main-wrapper">
            <!-- Left Panel - Shop List -->
            <div class="shop-list-panel">
                {% if role == 'admin' %}
                <button id="createShopBtn" class="create-btn" onclick="openCreateShopModal()">
                    <i class="bi bi-plus-circle"></i> Create New Shop
                </button>
                {% endif %}
                
                <div class="search-section">
                    <input 
                        type="text" 
                        id="shopSearchInput" 
                        class="search-input" 
                        placeholder="Search shops...">
                    <i class="bi bi-search search-icon"></i>
                </div>

                <div class="shops-container" id="shopsContainer">
                    <div class="loading-message">Loading shops...</div>
                </div>
            </div>

            <!-- Right Panel - Shop Details -->
            <div class="shop-details-panel">
                <div id="detailsContent" class="details-content">
                    <div class="empty-state">
                        <i class="bi bi-inbox"></i>
                        <p>Select a shop to view payment details</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Create/Edit Shop Modal -->
    <div class="modal fade" id="shopModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Create New Shop</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="shopForm">
                        <div class="mb-3">
                            <label for="shopName" class="form-label">Shop Name</label>
                            <input type="text" class="form-control" id="shopName" required>
                        </div>
                        <div class="mb-3">
                            <label for="shopAddress" class="form-label">Address</label>
                            <textarea class="form-control" id="shopAddress" rows="3" required></textarea>
                        </div>
                        <div class="mb-3">
                            <label for="shopNumber1" class="form-label">Number 1</label>
                            <input type="text" class="form-control" id="shopNumber1">
                        </div>
                        <div class="mb-3">
                            <label for="shopNumber2" class="form-label">Number 2</label>
                            <input type="text" class="form-control" id="shopNumber2">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary" id="submitBtn" onclick="saveShop()">Create</button>
                </div>
            </div>
        </div>
    </div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/shops.js') }}"></script>
</body>
</html>
